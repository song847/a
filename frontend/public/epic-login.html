<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超维史诗级登录系统</title>
    <style>
        /* ========================================== */
        /*           COLOR SYSTEM - 色彩规范           */
        /* ========================================== */
        :root {
            /* 主底色 */
            --color-void: #0A0A0F;
            --color-deep-space: #0F172A;
            --color-charcoal: #111827;
            --color-graphite: #1E293B;
            
            /* 核心霓虹撞色 */
            --color-neon-blue: #06B6D4;
            --color-neon-purple: #7C3AED;
            --color-neon-pink: #EC4899;
            
            /* 文字/图标色 */
            --color-text-primary: #E2E8F0;
            --color-text-highlight: #06B6D4;
            
            /* 动效曲线 */
            --ease-epic: cubic-bezier(0.12, 0.92, 0.15, 1);
            
            /* 玻璃拟态参数 */
            --glass-blur: blur(12px);
            --glass-opacity: 0.8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(180deg, var(--color-deep-space) 0%, var(--color-void) 100%);
            min-height: 100vh;
            overflow: hidden;
            color: var(--color-text-primary);
        }

        /* ========================================== */
        /*          BACKGROUND EFFECTS - 背景特效      */
        /* ========================================== */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .deep-space-gradient {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(6, 182, 212, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(124, 58, 237, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(236, 72, 153, 0.04) 0%, transparent 60%);
            animation: cosmicPulse 15s ease-in-out infinite;
        }

        @keyframes cosmicPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }

        .floating-particles {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--color-neon-blue);
            border-radius: 50%;
            opacity: 0.3;
            animation: float 20s linear infinite;
        }

        .particle:nth-child(odd) { background: var(--color-neon-purple); }
        .particle:nth-child(3n) { background: var(--color-neon-pink); }

        @keyframes float {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translateY(-100vh) translateX(100px); opacity: 0; }
        }

        /* ========================================== */
        /*           AUTH CONTAINER - 认证容器         */
        /* ========================================== */
        .auth-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            perspective: 2000px;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            background: rgba(30, 41, 59, var(--glass-opacity));
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-radius: 24px;
            padding: 56px 48px;
            box-shadow: 
                0 0 60px rgba(6, 182, 212, 0.15),
                0 25px 50px -12px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(6, 182, 212, 0.15);
            transform-style: preserve-3d;
            transition: transform 0.65s var(--ease-epic);
        }

        /* 3D翻转动效 */
        .auth-card.flipping {
            animation: cardFlip3D 0.65s var(--ease-epic);
        }

        @keyframes cardFlip3D {
            0% { transform: rotateY(0deg) translateZ(0); }
            25% { transform: rotateY(15deg) translateZ(30px); }
            50% { transform: rotateY(25deg) translateZ(50px); }
            75% { transform: rotateY(10deg) translateZ(20px); }
            100% { transform: rotateY(0deg) translateZ(0); }
        }

        /* 极光撕裂蒙版 */
        .aurora-mask {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(6, 182, 212, 0.1) 20%,
                rgba(124, 58, 237, 0.15) 50%,
                rgba(236, 72, 153, 0.1) 80%,
                transparent 100%
            );
            pointer-events: none;
            opacity: 0;
        }

        .aurora-mask.active {
            animation: auroraSweep 0.65s var(--ease-epic);
        }

        @keyframes auroraSweep {
            0% { left: -100%; opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { left: 200%; opacity: 0; }
        }

        /* ========================================== */
        /*             LOGO SECTION - Logo区域         */
        /* ========================================== */
        .logo-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-container {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            position: relative;
        }

        .logo-circle {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, var(--color-neon-blue) 0%, var(--color-neon-purple) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 0 40px rgba(6, 182, 212, 0.4),
                0 0 80px rgba(124, 58, 237, 0.2);
            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { 
                box-shadow: 0 0 40px rgba(6, 182, 212, 0.4), 0 0 80px rgba(124, 58, 237, 0.2);
                transform: scale(1);
            }
            50% { 
                box-shadow: 0 0 60px rgba(6, 182, 212, 0.6), 0 0 100px rgba(124, 58, 237, 0.3);
                transform: scale(1.02);
            }
        }

        .logo-icon {
            font-size: 36px;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
        }

        .brand-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(90deg, var(--color-text-primary), var(--color-neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-subtitle {
            font-size: 12px;
            color: rgba(226, 232, 240, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-top: 4px;
        }

        /* ========================================== */
        /*              FORM SECTION - 表单区域         */
        /* ========================================== */
        .form-container {
            position: relative;
        }

        .form-title {
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 32px;
            color: var(--color-text-primary);
        }

        .input-group {
            position: relative;
            margin-bottom: 24px;
        }

        .input-field {
            width: 100%;
            padding: 16px 0 12px;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(226, 232, 240, 0.2);
            font-size: 14px;
            color: var(--color-text-primary);
            transition: all 0.3s var(--ease-epic);
        }

        .input-field:focus {
            outline: none;
            border-color: var(--color-neon-blue);
        }

        .input-field::placeholder {
            color: rgba(226, 232, 240, 0.4);
        }

        .input-glow {
            position: absolute;
            bottom: -2px;
            left: 50%;
            width: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--color-neon-blue), var(--color-neon-purple));
            border-radius: 2px;
            transform: translateX(-50%);
            transition: width 0.4s var(--ease-epic);
        }

        .input-field:focus + .input-glow {
            width: 100%;
        }

        /* 表单切换动画 */
        .form-transition-enter {
            animation: formDeconstruct 0.4s var(--ease-epic) forwards;
        }

        .form-transition-exit {
            animation: formConstruct 0.4s var(--ease-epic) 0.25s forwards;
            opacity: 0;
        }

        @keyframes formDeconstruct {
            0% { opacity: 1; filter: blur(0); transform: translateY(0); }
            50% { opacity: 0.5; filter: blur(8px); transform: translateY(-10px); }
            100% { opacity: 0; filter: blur(12px); transform: translateY(-20px); }
        }

        @keyframes formConstruct {
            0% { opacity: 0; filter: blur(12px); transform: translateY(20px); }
            50% { opacity: 0.5; filter: blur(8px); transform: translateY(10px); }
            100% { opacity: 1; filter: blur(0); transform: translateY(0); }
        }

        /* ========================================== */
        /*               BUTTONS - 按钮样式             */
        /* ========================================== */
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--color-graphite), var(--color-charcoal));
            border: 1px solid rgba(6, 182, 212, 0.3);
            border-radius: 12px;
            color: var(--color-text-primary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s var(--ease-epic);
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(6, 182, 212, 0.2), transparent);
            transition: left 0.5s var(--ease-epic);
        }

        .btn-primary:hover {
            border-color: var(--color-neon-blue);
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.3);
            transform: translateY(-2px);
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        /* 按钮奇点坍缩动画 */
        .btn-primary.collapsing {
            animation: buttonCollapse 0.35s var(--ease-epic) forwards;
        }

        @keyframes buttonCollapse {
            0% { 
                transform: scale(1); 
                border-radius: 12px;
                box-shadow: 0 0 30px rgba(6, 182, 212, 0.3);
            }
            100% { 
                transform: scale(0.1); 
                border-radius: 50%;
                box-shadow: 0 0 60px rgba(6, 182, 212, 0.6), 0 0 100px rgba(124, 58, 237, 0.4);
            }
        }

        .toggle-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: rgba(226, 232, 240, 0.6);
        }

        .toggle-link span {
            color: var(--color-neon-blue);
            cursor: pointer;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .toggle-link span:hover {
            color: var(--color-text-primary);
        }

        /* ========================================== */
        /*          LOGIN TRANSITION EFFECTS           */
        /* ========================================== */

        /* 粒子爆炸容器 */
        .particles-explosion {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            display: none;
        }

        .particles-explosion.active {
            display: block;
        }

        .explosion-particle {
            position: absolute;
            border-radius: 50%;
            animation: explode 1s var(--ease-epic) forwards;
        }

        @keyframes explode {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(
                    calc((var(--rx, 0.5) - 0.5) * 600px),
                    calc((var(--ry, 0.5) - 0.5) * 600px)
                ) scale(0);
            }
        }

        /* 全屏裂痕效果 */
        .crack-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 101;
            display: none;
            background: transparent;
        }

        .crack-overlay.active {
            display: block;
            animation: crackSpread 0.5s var(--ease-epic) forwards;
        }

        .crack-line {
            position: absolute;
            background: linear-gradient(90deg, var(--color-neon-blue), var(--color-neon-purple));
            height: 2px;
            opacity: 0;
        }

        .crack-overlay.active .crack-line {
            animation: crackAppear 0.6s var(--ease-epic) forwards;
        }

        @keyframes crackSpread {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes crackAppear {
            0% { width: 0; opacity: 0; }
            50% { opacity: 1; }
            100% { width: 100%; opacity: 0.8; }
        }

        /* 黑洞引力波 */
        .blackhole-waves {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 102;
            display: none;
        }

        .blackhole-waves.active {
            display: block;
        }

        .wave-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid var(--color-neon-blue);
            border-radius: 50%;
            animation: waveExpand 0.8s var(--ease-epic) forwards;
            opacity: 0;
        }

        .wave-ring:nth-child(2) { animation-delay: 0.15s; }
        .wave-ring:nth-child(3) { animation-delay: 0.3s; }

        @keyframes waveExpand {
            0% {
                width: 20px;
                height: 20px;
                opacity: 1;
            }
            100% {
                width: 1500px;
                height: 1500px;
                opacity: 0;
            }
        }

        /* 全屏暗域遮罩 */
        .darkness-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--color-void);
            pointer-events: none;
            z-index: 103;
            opacity: 0;
            transition: opacity 0.5s var(--ease-epic);
        }

        .darkness-mask.active {
            opacity: 1;
        }

        /* 时空跃迁效果 */
        .spacetime-jump {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 104;
            display: none;
        }

        .spacetime-jump.active {
            display: block;
            animation: spacetimeWarp 0.6s var(--ease-epic) forwards;
        }

        .jump-gradient {
            width: 100%;
            height: 100%;
            background: linear-gradient(
                180deg,
                var(--color-void) 0%,
                rgba(6, 182, 212, 0.1) 30%,
                rgba(124, 58, 237, 0.1) 70%,
                var(--color-void) 100%
            );
            animation: gradientShift 0.6s var(--ease-epic);
        }

        @keyframes spacetimeWarp {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
                filter: blur(10px);
            }
            100% {
                opacity: 0;
                transform: scale(1);
                filter: blur(0);
            }
        }

        @keyframes gradientShift {
            0% { opacity: 0; }
            30% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* ========================================== */
        /*              DASHBOARD - 主界面             */
        /* ========================================== */
        .dashboard {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, var(--color-charcoal) 0%, var(--color-graphite) 100%);
            z-index: 200;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.6s var(--ease-epic), transform 0.6s var(--ease-epic);
        }

        .dashboard.visible {
            opacity: 1;
            transform: scale(1);
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 32px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            animation: headerSlideDown 0.5s var(--ease-epic) 0.3s both;
        }

        @keyframes headerSlideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .dashboard-title {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(90deg, var(--color-text-primary), var(--color-neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--color-neon-blue), var(--color-neon-purple));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
        }

        .user-info {
            text-align: right;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--color-text-primary);
        }

        .user-id {
            font-size: 11px;
            color: rgba(226, 232, 240, 0.5);
        }

        .dashboard-content {
            padding: 32px;
            animation: contentFadeIn 0.5s var(--ease-epic) 0.6s both;
        }

        @keyframes contentFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(6, 182, 212, 0.1);
            animation: statCardEnter 0.4s var(--ease-epic) backwards;
        }

        .stat-card:nth-child(1) { animation-delay: 0.7s; }
        .stat-card:nth-child(2) { animation-delay: 0.75s; }
        .stat-card:nth-child(3) { animation-delay: 0.8s; }
        .stat-card:nth-child(4) { animation-delay: 0.85s; }

        @keyframes statCardEnter {
            from { opacity: 0; transform: translateY(15px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--color-neon-blue), var(--color-neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 12px;
            color: rgba(226, 232, 240, 0.6);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .main-section {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(6, 182, 212, 0.1);
            animation: mainSectionEnter 0.4s var(--ease-epic) 0.9s both;
        }

        @keyframes mainSectionEnter {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: 20px;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
        }

        .nav-item {
            background: rgba(6, 182, 212, 0.05);
            border: 1px solid rgba(6, 182, 212, 0.2);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s var(--ease-epic);
            animation: navItemEnter 0.3s var(--ease-epic) backwards;
        }

        .nav-item:nth-child(1) { animation-delay: 1s; }
        .nav-item:nth-child(2) { animation-delay: 1.05s; }
        .nav-item:nth-child(3) { animation-delay: 1.1s; }
        .nav-item:nth-child(4) { animation-delay: 1.15s; }
        .nav-item:nth-child(5) { animation-delay: 1.2s; }
        .nav-item:nth-child(6) { animation-delay: 1.25s; }

        @keyframes navItemEnter {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .nav-item:hover {
            background: rgba(6, 182, 212, 0.15);
            border-color: var(--color-neon-blue);
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(6, 182, 212, 0.2);
        }

        .nav-icon {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .nav-label {
            font-size: 12px;
            color: var(--color-text-primary);
            font-weight: 500;
        }

        /* ========================================== */
        /*              RESPONSIVE DESIGN              */
        /* ========================================== */
        @media (max-width: 500px) {
            .auth-card {
                margin: 20px;
                padding: 40px 24px;
            }

            .dashboard-header {
                padding: 16px 20px;
            }

            .dashboard-content {
                padding: 20px;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <!-- 背景容器 -->
    <div class="background-container">
        <div class="deep-space-gradient"></div>
        <div class="floating-particles">
            <!-- 动态生成粒子 -->
        </div>
    </div>

    <!-- 登录/注册卡片 -->
    <div class="auth-wrapper">
        <div class="auth-card" id="authCard">
            <div class="aurora-mask" id="auroraMask"></div>
            
            <div class="logo-section">
                <div class="logo-container">
                    <div class="logo-circle">
                        <span class="logo-icon">⚡</span>
                    </div>
                </div>
                <h1 class="brand-title">NEXUS</h1>
                <p class="brand-subtitle">超维系统</p>
            </div>

            <!-- 登录表单 -->
            <div class="form-container" id="loginForm">
                <h2 class="form-title">登录</h2>
                <div class="input-group">
                    <input type="text" class="input-field" placeholder="用户名" id="loginUsername">
                    <div class="input-glow"></div>
                </div>
                <div class="input-group">
                    <input type="password" class="input-field" placeholder="密码" id="loginPassword">
                    <div class="input-glow"></div>
                </div>
                <button class="btn-primary" id="loginBtn">登录系统</button>
                <p class="toggle-link">没有账号？ <span id="goToRegister">立即注册</span></p>
            </div>

            <!-- 注册表单 -->
            <div class="form-container" id="registerForm" style="display: none;">
                <h2 class="form-title">注册</h2>
                <div class="input-group">
                    <input type="text" class="input-field" placeholder="用户名" id="registerUsername">
                    <div class="input-glow"></div>
                </div>
                <div class="input-group">
                    <input type="email" class="input-field" placeholder="邮箱" id="registerEmail">
                    <div class="input-glow"></div>
                </div>
                <div class="input-group">
                    <input type="password" class="input-field" placeholder="密码" id="registerPassword">
                    <div class="input-glow"></div>
                </div>
                <button class="btn-primary" id="registerBtn">创建账号</button>
                <p class="toggle-link">已有账号？ <span id="goToLogin">返回登录</span></p>
            </div>
        </div>
    </div>

    <!-- 转场特效容器 -->
    <div class="particles-explosion" id="particlesExplosion"></div>
    <div class="crack-overlay" id="crackOverlay">
        <div class="crack-line" style="top: 30%; left: 0; transform: rotate(-15deg);"></div>
        <div class="crack-line" style="top: 50%; left: 0; transform: rotate(5deg);"></div>
        <div class="crack-line" style="top: 70%; left: 0; transform: rotate(-25deg);"></div>
        <div class="crack-line" style="top: 40%; left: 0; transform: rotate(20deg);"></div>
        <div class="crack-line" style="top: 60%; left: 0; transform: rotate(-10deg);"></div>
    </div>
    <div class="blackhole-waves" id="blackholeWaves">
        <div class="wave-ring"></div>
        <div class="wave-ring"></div>
        <div class="wave-ring"></div>
    </div>
    <div class="darkness-mask" id="darknessMask"></div>
    <div class="spacetime-jump" id="spacetimeJump">
        <div class="jump-gradient"></div>
    </div>

    <!-- 主界面 -->
    <div class="dashboard" id="dashboard">
        <div class="dashboard-header">
            <h1 class="dashboard-title">NEXUS CONTROL CENTER</h1>
            <div class="user-profile">
                <div class="avatar">U</div>
                <div class="user-info">
                    <div class="user-name">管理员</div>
                    <div class="user-id">ID: #0001</div>
                </div>
            </div>
        </div>
        <div class="dashboard-content">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value">1,234</div>
                    <div class="stat-label">用户总数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">89%</div>
                    <div class="stat-label">在线率</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">5,678</div>
                    <div class="stat-label">数据总量</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">99.9%</div>
                    <div class="stat-label">系统稳定</div>
                </div>
            </div>
            <div class="main-section">
                <h2 class="section-title">功能模块</h2>
                <div class="nav-grid">
                    <div class="nav-item"><span class="nav-icon">📊</span><div class="nav-label">数据分析</div></div>
                    <div class="nav-item"><span class="nav-icon">👥</span><div class="nav-label">用户管理</div></div>
                    <div class="nav-item"><span class="nav-icon">⚙️</span><div class="nav-label">系统设置</div></div>
                    <div class="nav-item"><span class="nav-icon">📈</span><div class="nav-label">实时监控</div></div>
                    <div class="nav-item"><span class="nav-icon">🔒</span><div class="nav-label">安全中心</div></div>
                    <div class="nav-item"><span class="nav-icon">📱</span><div class="nav-label">移动端</div></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        //            DOM ELEMENTS
        // ==========================================
        const authCard = document.getElementById('authCard');
        const auroraMask = document.getElementById('auroraMask');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');
        const goToRegister = document.getElementById('goToRegister');
        const goToLogin = document.getElementById('goToLogin');
        
        // 转场特效元素
        const particlesExplosion = document.getElementById('particlesExplosion');
        const crackOverlay = document.getElementById('crackOverlay');
        const blackholeWaves = document.getElementById('blackholeWaves');
        const darknessMask = document.getElementById('darknessMask');
        const spacetimeJump = document.getElementById('spacetimeJump');
        const dashboard = document.getElementById('dashboard');

        // ==========================================
        //            PARTICLE GENERATION
        // ==========================================
        function generateParticles(count) {
            const container = document.querySelector('.floating-particles');
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + 'vh';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (15 + Math.random() * 10) + 's';
                container.appendChild(particle);
            }
        }

        // ==========================================
        //            FORM SWITCH ANIMATION
        // ==========================================
        function switchForm(fromForm, toForm) {
            // 添加翻转动画
            authCard.classList.add('flipping');
            auroraMask.classList.add('active');
            
            // 解构退场动画
            fromForm.classList.add('form-transition-enter');
            
            setTimeout(() => {
                fromForm.style.display = 'none';
                fromForm.classList.remove('form-transition-enter');
                
                toForm.style.display = 'block';
                toForm.classList.add('form-transition-exit');
                
                setTimeout(() => {
                    toForm.classList.remove('form-transition-exit');
                    authCard.classList.remove('flipping');
                    auroraMask.classList.remove('active');
                }, 400);
            }, 400);
        }

        goToRegister.addEventListener('click', () => {
            switchForm(loginForm, registerForm);
        });

        goToLogin.addEventListener('click', () => {
            switchForm(registerForm, loginForm);
        });

        // ==========================================
        //            LOGIN TRANSITION ANIMATION
        // ==========================================
        function createExplosionParticles(x, y) {
            const colors = ['#06B6D4', '#7C3AED', '#EC4899'];
            const container = particlesExplosion;
            
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'explosion-particle';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.width = (2 + Math.random() * 4) + 'px';
                particle.style.height = particle.style.width;
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.setProperty('--rx', Math.random());
                particle.style.setProperty('--ry', Math.random());
                particle.style.animationDelay = Math.random() * 0.2 + 's';
                container.appendChild(particle);
            }
            
            particlesExplosion.classList.add('active');
        }

        function runLoginTransition() {
            const btnRect = loginBtn.getBoundingClientRect();
            const centerX = btnRect.left + btnRect.width / 2;
            const centerY = btnRect.top + btnRect.height / 2;

            // 阶段1: 按钮坍缩 (0-350ms)
            loginBtn.classList.add('collapsing');
            
            // 阶段2: 全屏裂痕 + 黑洞波 (350-650ms)
            setTimeout(() => {
                createExplosionParticles(centerX, centerY);
                crackOverlay.classList.add('active');
                
                // 设置黑洞波位置
                blackholeWaves.style.left = centerX + 'px';
                blackholeWaves.style.top = centerY + 'px';
                blackholeWaves.classList.add('active');
                
                // 暗域遮罩
                darknessMask.classList.add('active');
            }, 350);

            // 阶段3: 时空跃迁 (650-1000ms)
            setTimeout(() => {
                spacetimeJump.classList.add('active');
            }, 650);

            // 阶段4: 主界面出现 (1000-1500ms)
            setTimeout(() => {
                dashboard.classList.add('visible');
            }, 1000);

            // 清理特效
            setTimeout(() => {
                particlesExplosion.classList.remove('active');
                crackOverlay.classList.remove('active');
                blackholeWaves.classList.remove('active');
                spacetimeJump.classList.remove('active');
                
                // 清空粒子
                while (particlesExplosion.firstChild) {
                    particlesExplosion.removeChild(particlesExplosion.firstChild);
                }
            }, 1500);
        }

        loginBtn.addEventListener('click', runLoginTransition);
        registerBtn.addEventListener('click', runLoginTransition);

        // ==========================================
        //            INITIALIZATION
        // ==========================================
        generateParticles(30);
    </script>
</body>
</html>
