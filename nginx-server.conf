server {
    listen 80;
    server_name springclo.cn www.springclo.cn;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name springclo.cn www.springclo.cn;

    ssl_certificate /etc/letsencrypt/live/springclo.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/springclo.cn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    location / {
        root /var/www/song-app/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://localhost:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    location /uploads/ {
        root /var/www/song-app/backend;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}
