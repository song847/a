server {
    listen 80;
    server_name springclo.cn www.springclo.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name springclo.cn www.springclo.cn;
    
    ssl_certificate /etc/letsencrypt/live/springclo.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/springclo.cn/privkey.pem;
    
    location / {
        root /var/www/song-app/frontend/dist;
        try_files $uri $uri/ /index.html;
    }
    
    location /api/ {
        proxy_pass http://localhost:3000/api/;
        proxy_set_header Host $host;
    }
}